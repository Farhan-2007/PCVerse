{% extends "layout.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Create Your PCVerse Account 🖥️</h2>

        <p class="auth-subtitle">
            Join PCVerse to build your dream PC, save your favorite components, and get AI-powered recommendations.
        </p>

        <form method="POST">

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required>

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="signupPassword"
                        name="password"
                        placeholder="Create a password"
                        required>

                    <button
                        type="button"
                        id="toggleSignupPassword">

                        👁

                    </button>

                </div>

            </div>

            <button type="submit" class="auth-btn">

                Create Account

            </button>

        </form>

        <p class="auth-link">

           Already have a PCVerse account?

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock content %}
