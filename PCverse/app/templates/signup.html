{% extends "layout.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Create Your PCVerse Account 🖥️</h2>

        <p class="auth-subtitle">
            Join PCVerse to build your dream PC, save components, and get rule-based recommendations.
        </p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">

                <label for="username">Username</label>

                <input type="text" id="username" name="username" placeholder="Choose a username" required>

            </div>

            <div class="form-group">

                <label for="email">Email Address</label>

                <input type="email" id="email" name="email" placeholder="Enter your email" required>

            </div>

            <div class="form-group">

                <label for="signupPassword">Password</label>

                <div class="password-box">

                    <input type="password" id="signupPassword" name="password" placeholder="Create a strong password"
                        required>

                    <button type="button" id="toggleSignupPassword" aria-label="Show Password">

                        👁

                    </button>

                </div>

            </div>

            <button type="submit" class="auth-btn">
                Create Account
            </button>

        </form>

        <p class="auth-link">

            Already have a PCVerse account?

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock content %}
