{% extends "layout.html" %}

{% block content %}

<h2> {{ book.name }}</h2>

<img src="{{ url_for('static', filename='product_pics/' + book.image_file) }}"
     alt="{{ book.name }}"
     width="200">

<p><strong>Author:</strong> {{ book.author }}</p>

<p><strong>Price:</strong> ₹{{ book.price }}</p>

<p><strong>Stock:</strong>{{ book.stock }}</p>

<p>{{ book.description }}</p>

{% endblock content %}
