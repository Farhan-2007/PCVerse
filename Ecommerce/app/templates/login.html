{% extends "layout.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Welcome Back 👋</h2>

        <p class="auth-subtitle">
            Login to continue to your Book Store account.
        </p>

        <form method="POST">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                    <button
                        type="button"
                        id="togglePassword">

                        👁

                    </button>

                </div>

            </div>

            <button type="submit" class="auth-btn">

                Login

            </button>

        </form>

        <p class="auth-link">

            Don't have an account?

            <a href="{{ url_for('auth.signup') }}">
                Sign Up
            </a>

        </p>

    </div>

</div>

{% endblock content %}
