<!DOCTYPE html>
<html>

<head>
    <title>Book Store</title>
    <link rel = "stylesheet" href="{{ url_for('static', filename = 'style.css') }}">
</head>

<body>

    <nav class="navbar">

        <a class="logo" href="{{ url_for('main.home') }}">
            📚 BookStore
        </a>

        <div class="nav-links">

            <a href="{{ url_for('main.home') }}">
                Home
            </a>

            <a href="{{ url_for('auth.login') }}">

            </a>

            <a href="{{ url_for('auth.signup') }}">
                Signup
            </a>

        </div>

    </nav>

    <div class="container">

        {% block content %}
        {% endblock content %}

    </div>

</body>

</html>
