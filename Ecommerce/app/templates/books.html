{% extends "layout.html" %}

{% block content %}

<section class="books-section">

    <h2 class="section-title">Categories</h2>

    <div class="category-list">

        {% for category in categories %}

        <a href="{{ url_for('main.category_books', category_id=category.id) }}"
           class="category-btn">

            {{ category.name }}

        </a>

        {% endfor %}

    </div>

    <h2 class="section-title">Featured Books</h2>

    <div class="book-grid">

        {% for book in books %}

        <div class="book-card">

            <img src="{{ url_for('static', filename='product_pics/' + book.image_file) }}"
                 alt="{{ book.name }}">

            <h3>{{ book.name }}</h3>

            <p class="author">
                {{ book.author }}
            </p>

            <p class="price">
                ₹{{ book.price }}
            </p>

            <a href="{{ url_for('main.book', book_id=book.id) }}"
               class="view-btn">

                View Details

            </a>

        </div>

        {% endfor %}

    </div>

</section>

{% endblock content %}
